name: Release

# Builds release artifacts for a version tag (vX.Y.Z or vX.Y.Z-alpha...).
# The release APK is signed ONLY when the signing secrets below are configured:
#   AURALYNX_KEYSTORE_BASE64, AURALYNX_KEYSTORE_PASSWORD, AURALYNX_KEY_ALIAS, AURALYNX_KEY_PASSWORD
# Without them the workflow publishes an *unsigned* release APK and says so in the release notes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v6

      - name: Verify tag matches gradle.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(grep '^auralynx.versionName=' gradle.properties | cut -d= -f2)"
          [ "$expected" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != $expected"; exit 1; }

      - name: Tests and lint gate
        run: ./gradlew testDebugUnitTest :core:common:test :core:protocol:test :core:automation:test :core:dsp:test :app:lintDebug

      - name: Decode signing key (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.AURALYNX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "AURALYNX_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::No signing secrets configured; the release APK will be UNSIGNED."
          fi

      - name: Build artifacts and checksums
        env:
          AURALYNX_KEYSTORE_PASSWORD: ${{ secrets.AURALYNX_KEYSTORE_PASSWORD }}
          AURALYNX_KEY_ALIAS: ${{ secrets.AURALYNX_KEY_ALIAS }}
          AURALYNX_KEY_PASSWORD: ${{ secrets.AURALYNX_KEY_PASSWORD }}
        run: ./scripts/package-release.sh

      - name: Remove decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=CHANGELOG.md
          cp "$notes" release-notes.md
          if [ "$SIGNED" != "true" ]; then
            printf '\n\n> **Unsigned build.** The release APK is not signed. Install the debug APK, or sign it yourself.\n' >> release-notes.md
          fi
          printf '\n\n### SHA-256\n```\n%s\n```\n' "$(cat dist/SHA256SUMS)" >> release-notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS
