name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK platform 37
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile all modules and assemble debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests (all modules)
        run: ./gradlew testDebugUnitTest :core:common:test :core:protocol:test :core:automation:test :core:dsp:test

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: auralynx-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  supply-chain:
    name: Dependency licenses and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: License audit (release runtime classpath)
        run: python3 scripts/check_licenses.py
      - name: Secret scan
        run: python3 scripts/scan_secrets.py
      - name: Dependency report
        run: ./gradlew -q :app:dependencies --configuration releaseRuntimeClasspath > dependency-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: |
            dependency-report.txt
            docs/DEPENDENCY_LICENSES.md

  instrumented:
    name: Instrumentation tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-test-lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run connected tests on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :core:data:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumentation-results
          path: '**/build/outputs/androidTest-results/'
