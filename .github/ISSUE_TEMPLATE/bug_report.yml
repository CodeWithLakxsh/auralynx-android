name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Auralynx version, placeholder: "0.1.0-alpha" }
    validations: { required: true }
  - type: input
    id: phone
    attributes: { label: Phone and Android version, placeholder: "Pixel 8, Android 16 (BP2A...)" }
    validations: { required: true }
  - type: input
    id: accessory
    attributes: { label: Accessory and firmware, placeholder: "AirPods Pro 2 USB-C, firmware 7E93" }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: diag
    attributes:
      label: Diagnostic report (optional)
      description: Security & privacy → Export report. Identifiers are redacted, but review it before attaching.
