auralynx.applicationId=io.github.codewithlakxsh.auralynx
auralynx.versionName=0.1.0-alpha
# versionCode = MAJOR*1_000_000 + MINOR*10_000 + PATCH*100 + build (alpha builds use 0-49)
auralynx.versionCode=1000
